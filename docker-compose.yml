services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studyai
      POSTGRES_USER: studyai
      POSTGRES_PASSWORD: studyai
    ports:
      - "5432:5432"
    volumes:
      - studyai_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyai -d studyai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://studyai:studyai@db:5432/studyai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - studyai_uploads:/app/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  studyai_db:
  studyai_uploads:
